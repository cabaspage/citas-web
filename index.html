<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Citas</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Citas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#18201d; --muted:#5d6b66; --line:#dfe5e0;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#d9efeb;
  --danger:#b42318; --danger-soft:#fde8e6; --ok:#13795b; --warn:#9a5b00; --warn-soft:#fdf0d5;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --card:#19201d; --ink:#e8eeeb; --muted:#9fb0a9; --line:#2a3430;
    --brand:#2bb3a3; --brand-ink:#05211e; --brand-soft:#17332f;
    --danger:#ff8f84; --danger-soft:#3a1c19; --ok:#5fd3a8; --warn:#f0b95a; --warn-soft:#332713;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:0 16px 40px}
header.top{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
header.top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.iconbtn{border:0;background:var(--card);color:var(--ink);width:42px;height:42px;border-radius:12px;font-size:20px;box-shadow:var(--shadow);cursor:pointer}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin:0 0 12px}
.hello{margin:6px 0 14px}
.hello b{font-size:24px;letter-spacing:-.02em;display:block}
.hello span{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);border:0;cursor:pointer}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.off{background:var(--line);color:var(--muted)}
.menu{display:grid;gap:10px;margin-top:10px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);padding:16px;border-radius:16px;font-size:17px;font-weight:600;box-shadow:var(--shadow);cursor:pointer;min-height:64px}
.mbtn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.mbtn .ic{font-size:26px;width:36px;text-align:center}
.mbtn:active,.btn:active,.slot:active,.item:active{transform:scale(.98)}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
input:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.err{color:var(--danger);background:var(--danger-soft);padding:10px 12px;border-radius:12px;margin-top:10px;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:var(--brand);color:var(--brand-ink);cursor:pointer;min-height:52px;text-align:center;text-decoration:none}
.btn.sec{background:var(--brand-soft);color:var(--brand)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack>*+*{margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:8px}
.slot{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 6px;font-size:15px;font-weight:600;cursor:pointer;min-height:48px}
.slot.sel{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.slot small{display:block;font-weight:400;font-size:11px;opacity:.8}
.list{display:grid;gap:8px;margin-top:10px}
.item{display:block;width:100%;text-align:left;border:0;background:var(--card);color:var(--ink);padding:14px 16px;border-radius:14px;font-size:16px;box-shadow:var(--shadow);cursor:pointer}
.item small{display:block;color:var(--muted);font-size:13px}
.item .t{font-weight:700}
.cita{border-left:5px solid var(--brand);padding-left:12px}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.ok-card{text-align:center;padding:26px 16px}
.ok-card .big{font-size:46px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.seg button{flex:1;min-width:90px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.days input{width:auto;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;max-width:90%;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
dialog{border:0;border-radius:18px;padding:20px;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px}
dialog p{margin:0 0 16px;color:var(--muted);white-space:pre-line}
.k{font-size:13px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
